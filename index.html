html,body{margin:0;min-height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;min-height:100vh;
 font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ticket{position:relative;width:min(1200px,100vw);aspect-ratio:1881/836;background:var(--bg) center/100% 100% no-repeat;container-type:inline-size}
/* Escultura: elemento independiente, su movimiento lo maneja JS (rAF) */
.sculpt{position:absolute;left:8.931%;top:12.560%;width:32.642%;height:auto;pointer-events:none;will-change:transform,filter;opacity:.88}
.panel{position:absolute;left:44.6%;top:12.5%;width:37.6%;height:74%;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);font-size:var(--fs)}
h1{margin:0;font-size:var(--h1);font-weight:600;letter-spacing:.38em;line-height:1;color:var(--ink)}
.sub,.hint,label,button,.val{font-family:"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
.sub{margin:.9em 0 0;color:var(--dim);font-size:.9em}
.hint{margin:0;color:#6d6d6a;font-size:.8em;text-align:center}
/* Teclado */
.kbframe{border:1px solid var(--line);padding:.7cqw;background:#070707;box-shadow:inset 0 0 12px #000}
.kb{position:relative;width:90%;margin:0 auto;height:var(--kbh);touch-action:none}
.k{position:absolute;box-sizing:border-box;transition:transform .16s ease-out,filter .22s ease-out,box-shadow .22s ease-out,background .22s}
.k.w{top:0;height:100%;background:linear-gradient(#d4d4d1,#ecece9);border:1px solid #4a4a48;border-radius:0 0 2px 2px;color:#6b6b68;
 font:600 .8em "SF Mono",Menlo,monospace;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.5em}
.k.b{top:0;height:61%;z-index:2;background:linear-gradient(#303030,#0c0c0c);border:1px solid #000;border-radius:0 0 2px 2px;
 box-shadow:0 .25cqw .4cqw rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.k.down{transition-duration:.04s}
.k.w.down{transform:translateY(1.5px);background:linear-gradient(#e4e4e0,#fbfbf8);box-shadow:inset 0 -1.6cqw 1.6cqw rgba(255,255,255,.75),0 0 1.2cqw rgba(255,255,255,.3)}
.k.b.down{transform:translateY(1px);background:linear-gradient(#4a4a4a,#222);box-shadow:inset 0 -.9cqw .9cqw rgba(255,255,255,.28),0 0 .9cqw rgba(255,255,255,.22)}
/* Controles */
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1cqw 1.4cqw;align-items:end}
.grp{display:flex;flex-direction:column;gap:.55em;min-width:0}
.grp.c2{grid-column:span 3}.grp.c1{grid-column:span 1}
label{display:flex;justify-content:space-between;color:var(--dim);font-size:.82em}
.val{color:var(--ink)}
.seg{display:flex;gap:.35cqw}
button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);padding:.7em 0;font-size:.85em;cursor:pointer;border-radius:0}
button:hover{border-color:var(--ink)}button.on{background:var(--ink);color:#0b0b0b;border-color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.6em;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:.8em;height:1.3em;margin-top:-.65em;background:var(--ink);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:.8em;height:1.3em;background:var(--ink);border:0;border-radius:0}
.stub{display:none}
/* Móvil: la entrada se reorganiza en vertical sin deformar imágenes */
@media (max-width:720px){
 :root{--fs:11px;--kbh:34vw;--gap:16px;--h1:21px}
 body{align-items:flex-start}
 .ticket{aspect-ratio:auto;width:calc(100% - 20px);margin:10px;background:var(--paper) center/cover;border-radius:14px;
  box-shadow:inset 0 0 50px #000,0 4px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;overflow:hidden}
 .sculpt{position:static;width:50%;margin:20px 0 0}
 .panel{position:static;width:100%;box-sizing:border-box;padding:14px 12px 10px}
 .kbframe{padding:6px}.k.b{box-shadow:0 3px 5px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18)}
 .ctl{grid-template-columns:repeat(2,1fr);gap:14px}.grp.c2,.grp.c1{grid-column:span 1}
 .grp.c2{grid-column:span 2}button{padding:.95em 0}
 .stub{display:block;width:calc(100% - 24px);height:46px;margin:6px 12px 14px;border-top:2px dashed #cfcfcc;padding-top:10px;box-sizing:border-box;
  background:repeating-linear-gradient(90deg,#d8d8d5 0 2px,transparent 2px 5px,#d8d8d5 5px 6px,transparent 6px 11px) 0 12px/100% 24px no-repeat}
}

<script>
(() => {
'use strict';
/* ===== Configuración ===== */
const CFG = { keys: 25, baseMidi: 48 /* C3 */, maxVoices: 14, maxTails: 28, decay: 0.35, sustain: 0.7, peak: 0.2 };
/* Carácter de cada onda: ganancia, apertura del filtro (cutoff = f*bright + 600) y detune del par de osciladores */
const WAVES = {
  sine:     { gain: 1.0,  bright: 24, detune: 3 },
  triangle: { gain: 0.95, bright: 12, detune: 4 },
  sawtooth: { gain: 0.5,  bright: 6,  detune: 8 },
  square:   { gain: 0.42, bright: 4.5, detune: 6 }
};
const state = { wave: 'triangle', oct: 0, attack: 0.03, release: 0.6, chorus: 0.35, delay: 0.25 };
/* Teclado físico: tecla -> semitono desde la primera nota */
const KEYMAP = { KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17 };
const LABEL = c => c === 'Semicolon' ? ';' : c === 'Quote' ? "'" : c.replace('Key', '');

/* ===== Audio ===== */
let ctx, bus, chorusWet, delayWet;
const voices = new Map();   // midi -> voz activa
const allVoices = new Set(); // activas + en release (para limitar nodos)

function initAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const master = ctx.createGain(); master.gain.value = 0.85;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.22;
  master.connect(comp); comp.connect(ctx.destination);
  bus = ctx.createGain();
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 7500; tone.Q.value = 0.3; // calidez general
  bus.connect(tone); tone.connect(master);
  // CHORUS: dos líneas de delay moduladas por LFO lentos, abiertas en estéreo
  chorusWet = ctx.createGain(); chorusWet.connect(master);
  [[0.019, 0.29, -0.8], [0.026, 0.37, 0.8]].forEach(([base, rate, pan]) => {
    const d = ctx.createDelay(0.1); d.delayTime.value = base;
    const lfo = ctx.createOscillator(); lfo.frequency.value = rate;
    const depth = ctx.createGain(); depth.gain.value = 0.0028;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    lfo.connect(depth); depth.connect(d.delayTime); lfo.start();
    tone.connect(d); d.connect(p); p.connect(chorusWet);
  });
  // DELAY: eco suave con feedback moderado y filtrado (no ensucia)
  const dIn = ctx.createGain(), dl = ctx.createDelay(1.5), fb = ctx.createGain(), fbf = ctx.createBiquadFilter();
  dl.delayTime.value = 0.36; fb.gain.value = 0.33; fbf.type = 'lowpass'; fbf.frequency.value = 2600;
  tone.connect(dIn); chorusWet.connect(dIn); dIn.connect(dl); dl.connect(fbf); fbf.connect(fb); fb.connect(dl);
  delayWet = ctx.createGain(); dl.connect(delayWet); delayWet.connect(master);
  applyFx(true);
}
function applyFx(now) {
  if (!ctx) return;
  const t = ctx.currentTime, k = now ? 0.001 : 0.04;
  chorusWet.gain.setTargetAtTime(state.chorus * 0.8, t, k);
  delayWet.gain.setTargetAtTime(state.delay * 0.6, t, k);
}
/* Nivel actual de la envolvente (calculado en JS para que el release arranque sin saltos) */
function envLevel(v, t) {
  const dt = t - v.t0, A = v.A, s = v.P * CFG.sustain;
  if (dt < A) return v.P * dt / A;
  return s + (v.P - s) * Math.exp(-(dt - A) / (CFG.decay / 3));
}
function noteOn(midi) {
  initAudio();
  if (voices.has(midi)) noteOff(midi, 0.04);
  if (voices.size >= CFG.maxVoices) noteOff(voices.keys().next().value, 0.05); // roba la más vieja
  const t = ctx.currentTime + 0.005, f = 440 * Math.pow(2, (midi - 69) / 12), w = WAVES[state.wave];
  const A = Math.max(0.004, state.attack), P = CFG.peak * w.gain;
  const env = ctx.createGain(); env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(P, t + A);
  env.gain.setTargetAtTime(P * CFG.sustain, t + A, CFG.decay / 3);
  const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 0.8;
  const open = Math.min(9000, f * w.bright + 700);
  flt.frequency.setValueAtTime(open, t); flt.frequency.setTargetAtTime(open * 0.45, t + A, 0.4);
  const oscs = [];
  [[-w.detune, 0.5, 1], [w.detune, 0.5, 1], [0, 0.32, 0.5]].forEach(([det, g, mul], i) => {
    const o = ctx.createOscillator(); o.type = i === 2 ? 'sine' : state.wave; // sub-octava senoidal = cuerpo
    o.frequency.value = f * mul; o.detune.value = det;
    const og = ctx.createGain(); og.gain.value = g; o.connect(og); og.connect(flt); o.start(t); oscs.push(o, og);
  });
  flt.connect(env); env.connect(bus);
  const v = { env, flt, oscs, t0: t, A, P, released: false };
  voices.set(midi, v); allVoices.add(v);
  if (allVoices.size > CFG.maxTails) { // limita colas de release acumuladas
    for (const o of allVoices) if (o.released) { kill(o); break; }
  }
}
function dispose(v) {
  allVoices.delete(v);
  try { v.oscs.forEach(n => n.disconnect()); v.flt.disconnect(); v.env.disconnect(); } catch (e) {}
}
function kill(v) {
  const t = ctx.currentTime;
  v.env.gain.cancelScheduledValues(t); v.env.gain.setValueAtTime(envLevel(v, t), t); v.env.gain.setTargetAtTime(0, t, 0.01);
  v.oscs.forEach(n => n.stop && n.stop(t + 0.08)); allVoices.delete(v);
}
function noteOff(midi, rel) {
  const v = voices.get(midi); if (!v) return;
  voices.delete(midi); v.released = true;
  const R = rel || Math.max(0.05, state.release), t = ctx.currentTime;
  v.env.gain.cancelScheduledValues(t); v.env.gain.setValueAtTime(envLevel(v, t), t);
  v.env.gain.setTargetAtTime(0, t, R / 4); // release exponencial suave, sin clicks
  const end = t + R * 1.5 + 0.05, src = v.oscs.filter(n => n.stop);
  src.forEach(n => n.stop(end)); src[0].onended = () => dispose(v);
}

/* ===== Teclado virtual (HTML/CSS) ===== */
const kb = document.getElementById('kb'), keyEls = [];
const BLACK = [0,1,0,1,0,0,1,0,1,0,1,0], WW = 100 / 15, BW = WW * 0.6;
const codeOf = {}; for (const c in KEYMAP) codeOf[KEYMAP[c]] = c;
let wi = 0;
for (let i = 0; i < CFG.keys; i++) {
  const el = document.createElement('div'); el.dataset.i = i;
  if (BLACK[i % 12]) { el.className = 'k b'; el.style.left = (wi * WW - BW / 2) + '%'; el.style.width = BW + '%'; }
  else { el.className = 'k w'; el.style.left = (wi * WW) + '%'; el.style.width = WW + '%'; if (codeOf[i]) el.textContent = LABEL(codeOf[i]); wi++; }
  kb.appendChild(el); keyEls.push(el);
}
/* held: tecla -> { midi, ids } (varias fuentes pueden sostener la misma tecla) */
const held = new Map();
function press(i, id) {
  let r = held.get(i);
  if (!r) { r = { midi: CFG.baseMidi + state.oct * 12 + i, ids: new Set() }; held.set(i, r); noteOn(r.midi); keyEls[i].classList.add('down'); kick(r.midi); }
  r.ids.add(id);
}
function release(i, id) {
  const r = held.get(i); if (!r) return;
  r.ids.delete(id);
  if (!r.ids.size) { held.delete(i); noteOff(r.midi); keyEls[i].classList.remove('down'); }
}
function releaseAll() { for (const [i, r] of [...held]) for (const id of [...r.ids]) release(i, id); }
/* Mouse / touch / pen con glissando; cada puntero es una fuente independiente */
const ptr = new Map();
const keyAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const k = el && el.closest && el.closest('.k'); return k ? +k.dataset.i : null; };
kb.addEventListener('pointerdown', e => {
  e.preventDefault(); const i = keyAt(e); if (i === null) return;
  kb.setPointerCapture(e.pointerId); ptr.set(e.pointerId, i); press(i, 'p' + e.pointerId);
});
kb.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const i = keyAt(e), old = ptr.get(e.pointerId);
  if (i !== null && i !== old) { release(old, 'p' + e.pointerId); ptr.set(e.pointerId, i); press(i, 'p' + e.pointerId); }
});
const up = e => { if (!ptr.has(e.pointerId)) return; release(ptr.get(e.pointerId), 'p' + e.pointerId); ptr.delete(e.pointerId); };
kb.addEventListener('pointerup', up); kb.addEventListener('pointercancel', up);
kb.addEventListener('contextmenu', e => e.preventDefault());
/* Teclado físico */
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'KeyZ' || e.code === 'KeyX') { if (!e.repeat) setOct(state.oct + (e.code === 'KeyX' ? 1 : -1)); return; }
  const i = KEYMAP[e.code]; if (i === undefined) return;
  e.preventDefault(); if (!e.repeat) press(i, e.code);
});
addEventListener('keyup', e => { const i = KEYMAP[e.code]; if (i !== undefined) release(i, e.code); });
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

/* ===== Controles ===== */
const $ = id => document.getElementById(id);
const fmtT = s => s < 1 ? Math.round(s * 1000) + ' ms' : s.toFixed(2) + ' s';
function setOct(o) {
  state.oct = Math.max(-2, Math.min(2, o));
  $('vo').textContent = (state.oct > 0 ? '+' : '') + state.oct + ' · C' + (3 + state.oct) + '–C' + (5 + state.oct);
}
function setWave(w) {
  state.wave = w; $('vw').textContent = w.slice(0, 3);
  document.querySelectorAll('#waves button').forEach(b => b.classList.toggle('on', b.dataset.w === w));
}
document.querySelectorAll('#waves button').forEach(b => b.onclick = () => setWave(b.dataset.w));
$('od').onclick = () => setOct(state.oct - 1); $('ou').onclick = () => setOct(state.oct + 1);
const bind = (id, vid, fn, fmt) => { const s = $(id); const f = () => { const v = s.value / 100; fn(v); $(vid).textContent = fmt(v); applyFx(); }; s.oninput = f; f(); };
bind('sa', 'va', v => state.attack = 0.004 * Math.pow(400, v), v => fmtT(0.004 * Math.pow(400, v)));
bind('sr', 'vr', v => state.release = 0.05 * Math.pow(60, v), v => fmtT(0.05 * Math.pow(60, v)));
bind('sc', 'vc', v => state.chorus = v, v => Math.round(v * 100) + '%');
bind('sd', 'vd', v => state.delay = v, v => Math.round(v * 100) + '%');
setWave(state.wave); setOct(0);

/* ===== Escultura reactiva (desacoplada del audio: solo rAF, nunca bloquea el sonido) ===== */
const sculpt = $('sculpt');
const S = { rx: 0, ry: 0, rz: 0, sc: 0 }, V = { rx: 0, ry: 0, rz: 0, sc: 0 };
let glow = 0, pulse = 0, running = false;
function kick(midi) { // cada nota empuja la escultura en una dirección distinta
  const pc = midi % 12, a = pc / 12 * Math.PI * 2;
  V.rx += Math.sin(a) * 0.7; V.ry += Math.cos(a) * 0.9; V.rz += (pc - 5.5) * 0.08; V.sc += 0.004;
  pulse = Math.min(1, pulse + 0.5);
  if (!running) { running = true; requestAnimationFrame(frame); }
}
function frame() {
  for (const k in S) { V[k] = (V[k] - S[k] * 0.06) * 0.86; S[k] += V[k]; } // resorte amortiguado
  glow += (Math.min(1, held.size * 0.4) - glow) * 0.12; pulse *= 0.93;
  const g = Math.min(1, glow + pulse);
  sculpt.style.transform = `perspective(900px) rotateX(${S.rx}deg) rotateY(${S.ry}deg) rotate(${S.rz}deg) scale(${1 + S.sc})`;
  sculpt.style.filter = `brightness(${1 + g * 0.55}) drop-shadow(0 0 ${g * 12}px rgba(255,255,255,${g * 0.4}))`;
  sculpt.style.opacity = 0.88 + g * 0.12;
  const still = Object.keys(S).every(k => Math.abs(S[k]) < 0.002 && Math.abs(V[k]) < 0.002);
  if (still && !held.size && g < 0.01) { running = false; sculpt.style.transform = sculpt.style.filter = ''; sculpt.style.opacity = ''; }
  else requestAnimationFrame(frame);
}
})();
</script></body></html>
